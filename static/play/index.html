<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Individual experience | HP Cyber Siege</title>
<link rel="icon" href="/static/brand/hp-logo-keyline.png">
<link rel="stylesheet" href="/static/shared.css">
<link rel="stylesheet" href="/static/play/play.css">
</head>
<body class="team-shell">
<a class="skip-link" href="#main">Skip to your experience</a>
<header>
<a class="brand" href="/" aria-label="HP Cyber Siege home">
<img class="hp-logo" src="/static/brand/hp-logo-keyline.png" alt="HP">
<span class="brand-divider">
</span>
<span class="brand-copy">
<strong>Cyber Siege</strong>
<small>Your individual experience</small>
</span>
</a>
<div class="phone-clock">
<span>YOUR EXPERIENCE</span>
<strong class="timer" data-timer>LOBBY</strong>
</div>
</header>
<main id="main">
<nav id="phone-progress" class="phone-progress" aria-label="Your mission progress">
</nav>
<div id="status">
</div>
<div id="error" role="alert" class="error hidden">
</div>
<div id="app">
</div>
</main>
<dialog id="raw" aria-labelledby="evidence-title">
<p class="eyebrow">SOURCE EVIDENCE</p>
<h2 id="evidence-title">Fictional log evidence</h2>
<pre id="logtext">
</pre>
<button id="close-log">Close evidence</button>
</dialog>
<footer>
<span class="eyebrow">HP ZGX FURY / HP LIMITLESS</span>
<p>Fictional company, people, incident and logs.<br>No cybersecurity knowledge needed. No prompts to write.</p>
<span class="connection" data-connection>Connecting…</span>
</footer>
<script type="module" src="/static/play/play.js">
</script>
</body>
</html>
